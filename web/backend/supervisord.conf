[supervisord]
nodaemon=true

; Migrations are NOT a program here. supervisord's `priority` orders starts but
; does not wait for one to finish, so running them here let uvicorn serve against
; a half-migrated schema. They now run in entrypoint.sh before this file loads.

; Each process can be switched off so the same image can run as an API-only
; service, a worker-only service, or both together. Defaults come from
; entrypoint.sh, which sets them if the environment does not.

[program:redis]
command=/usr/bin/redis-server
autostart=%(ENV_RUN_LOCAL_REDIS)s
autorestart=true
startsecs=5
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app/web/backend
autostart=%(ENV_RUN_API)s
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery]
command=python -m celery -A app.core.celery_app:celery_app worker --loglevel=info -Q main-queue,celery --concurrency=1
directory=/app/web/backend
autostart=%(ENV_RUN_WORKER)s
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
